<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-dark text-white py-4 px-4" style="background-color: #0f172a !important;">
          <h4 class="card-title mb-1 h5 fw-bold">Reserva tu estancia</h4>
          <p class="text-white-50 small mb-0">Completa tus datos personales para asegurar tu alojamiento.</p>
        </div>

        <div class = "galeria">
          <img src = "images/casaColonialVillaLeyva.jpg" alt = "Casa colonial en Villa de Leyva" />
          <img src = "images/hotelBoutique.webp" alt = "Habitacion de hotel Boutique." />
          <img src = "images/apartamentoFrenteAlMar.jpg" alt = "Apartamento frente al mar" />
        </div>

        <div class="card-body p-4 p-md-5">

          <div class="alert alert-light border rounded-3 d-flex justify-content-between align-items-center mb-4 py-3">
            <span class="text-muted fw-semibold">Total a pagar:</span>
            <strong class="h4 mb-0 text-primary fw-bold">
              {{ cotizacion?.total | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}
            </strong>
          </div>

          <form [formGroup]="form" (ngSubmit)="confirmarReserva()" novalidate>

            <div class="mb-3">
              <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
              <input id="nombre" type="text" class="form-control form-control-lg fs-6"
                     formControlName="nombre"
                     placeholder="Ej. Ricardo Hernández"
                     [class.is-invalid]="campoInvalido('nombre')"/>
              <div class="invalid-feedback">{{ mensajeError('nombre') }}</div>
            </div>

            <div class="mb-4">
              <label for="correo" class="form-label fw-semibold">Correo electrónico</label>
              <input id="correo" type="email" class="form-control form-control-lg fs-6"
                     formControlName="correo"
                     placeholder="ejemplo@correo.com"
                     [class.is-invalid]="campoInvalido('correo')"/>
              <div class="invalid-feedback">{{ mensajeError('correo') }}</div>
            </div>

            <button type="submit" class="btn btn-dark w-100 fw-bold py-3 rounded-pill shadow-sm"
                    style="background-color: #b45309; border: none;">
              Confirmar reserva
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
