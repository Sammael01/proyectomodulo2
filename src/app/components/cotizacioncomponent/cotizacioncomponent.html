<section class="ficha" aria-labelledby="titulo-cotizacion">
  <header class="ficha-encabezado">
    <h2 id="titulo-cotizacion">Cotiza tu estancia</h2>
    <p class="precio"><strong></strong> por noche</p>
  </header>

  <div class="ficha-cuerpo">
    <form novalidate>

      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <label for="llegada" class="form-label fw-semibold">Fecha de llegada</label>
          <input id="llegada" type="date" class="form-control"/>
        </div>

        <div class="col-12 col-sm-6">
          <label for="salida" class="form-label fw-semibold">Fecha de salida</label>
          <input id="salida" type="date" class="form-control"/>
        </div>

        <div class = "galeria">
          <img src = "images/apartamentoModernoLoft.jpg" alt = "Sala del apartamento moderno tipo loft" />
          <img src = "images/apartamentoFrenteAlMar.jpg" alt = "Apartamento con vista frente al mar" />
          <img src = "images/apartamentoEjecutivoMedellin.jpg" alt = "Apartamento ejecutivo en Medellin" />
        </div>

        <div class="col-12">
          <label for="huespedes" class="form-label fw-semibold">
            Huéspedes <span class="text-secondary fw-normal">(máx. 0)</span>
          </label>
          <input id="huespedes" type="number" class="form-control" min="1"/>
        </div>
      </div>

      <button type="submit" class="boton-cobre mt-3">Calcular cotización</button>
    </form>

    <div class="resultado" aria-live="polite">
      <p class="ayuda">Elige tus fechas y huéspedes para ver el total antes de reservar.</p>
    </div>
  </div>
</section>
