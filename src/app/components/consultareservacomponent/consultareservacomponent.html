<div class = "container my-4">
  <h2 class = "h3 fw-bold mb-4">Mis reservas</h2>

  <div class = "alert alert-info border-0 shadow-sm d-flex align-items-center mb-4" role = "alert">

          <tr>

        <thead scope = "col" class = "py-3">Llegada</thead>
        <thead scope = "col" class = "py-3">Salida</thead>

        <thead scope = "col" class = "py-3 text-end">Total</thead>
        <thead scope = "col" class = "py-3 text-center pe-4">Estado</thead>
          </tr>
        </thead>
        <tbody>

        <!-- Fila de ejemplo 1 -->
        <tr>
          <td class="ps-4">
            <div class="fw-semibold text-dark">Hotel Grand Suite</div>
            <small class="text-muted font-monospace">RES-84920</small>
          </td>
          <td>Bogotá</td>
          <td>15/10/2026</td>
          <td>20/10/2026</td>
          <td class="text-center">2</td>
          <td class="text-end fw-semibold">$875.000</td>
          <td class="text-center pe-4">
              <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-2">

        <!-- Fila de ejemplo 2 -->

          <td class="text-end fw-semibold">$450.000</td>
          <td class="text-center pe-4">
              <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill px-3 py-2">
                Pendiente
              </span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

</div>
