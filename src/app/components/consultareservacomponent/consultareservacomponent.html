<div class="contenedor">
  <header class="encabezado">
    <h1 class="titulo">Mis reservas</h1>
  </header>

  <div class="vacio" role="status">
    <h2>Aún no tienes reservas</h2>
    <p>Cuando confirmes una reserva, aparecerá aquí con todos sus datos.</p>
    <a routerLink="/" class="boton-cobre">Explorar alojamientos</a>
  </div>

  <div class="franja">
    <img src="images/hotelOpcionEconomica.jpg" alt="Cabaña con vista al embalse de Guatape"/>
    <img src="images/casaCampestre.webp" alt="Casa campestre rodeada de naturaleza"/>
    <img src="images/alojamientoPlaya.jpeg" alt="Alojamiento cerca de la playa"/>
  </div>

  <div class="tarjeta-tabla">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <caption class="visually-hidden">Listado de reservas realizadas</caption>
        <thead>
        <tr>
          <th scope="col">Alojamiento</th>
          <th scope="col">Ciudad</th>
          <th scope="col">Llegada</th>
          <th scope="col">Salida</th>
          <th scope="col" class="text-center">Huéspedes</th>
          <th scope="col" class="text-end">Total</th>
          <th scope="col">Estado</th>
        </tr>
        </thead>
      </table>
    </div>
  </div>
</div>
